# NemoClaw Blueprint — Software Factory

blueprint:
  name: software-factory
  version: "1.0.0"
  description: AI software factory — 7 roles, local inference, network-denied sandbox

sandbox:
  image: openclaw
  gpu: true
  memory_limit: 64G
  process_limit: 512
  network: deny-by-default

agents:
  - name: tech-lead
    soul: config/openclaw/agents/tech-lead/SOUL.md
    model: gemini-4
    permissions: [read, write]

  - name: product-manager
    soul: config/openclaw/agents/product-manager/SOUL.md
    model: gemini-4
    permissions: [read, write]

  - name: architect
    soul: config/openclaw/agents/architect/SOUL.md
    model: nemotron
    permissions: [read, write]

  - name: devops-qa
    soul: config/openclaw/agents/devops-qa/SOUL.md
    model: nemotron
    permissions: [read, write, git, sandbox-exec]

  - name: tpm
    soul: config/openclaw/agents/tpm/SOUL.md
    model: gemini-4
    permissions: [read, write]

  - name: implementer
    soul: config/openclaw/agents/implementer/SOUL.md
    model: qwen3.6
    permissions: [read, write]

  - name: docs-engineer
    soul: config/openclaw/agents/docs-engineer/SOUL.md
    model: gemini-4
    permissions: [read, write]

inference:
  provider: custom  # OpenAI-compatible (llama-swap)
  endpoint: http://172.18.0.1:9292/v1  # llama-swap via docker bridge (localhost is wrong inside sandboxes)
  # llama-swap model ids (one loaded at a time; mixed models cause swap churn).
  # MVP: all roles resolve to qwen3.6-35b-a3b-fp8; swap per-role later if needed.
  models:
    gemini-4: qwen3.6-35b-a3b-fp8
    nemotron: qwen3.6-35b-a3b-fp8
    qwen3.6: qwen3.6-35b-a3b-fp8
    # nemotron-alt: nemotron-nano-30b   # available: nemotron-nano-30b, nemotron-super-120b, qwen3.6-27b
