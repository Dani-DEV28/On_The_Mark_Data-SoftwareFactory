analysis: 'The issue is a straightforward CLI enhancement: wire `--version` into the Typer app.

  `petri.__version__` already resolves from package metadata. We just need to add an eager `--version`
  option to the main callback in `petri/cli/__init__.py` and add a corresponding test in `tests/integration/test_cli.py`.

  No architectural changes, no new modules, no DB/API changes. Purely additive CLI wiring.

  '
type: feature
needs_architect: false
affected_files:
- petri/cli/__init__.py
- tests/integration/test_cli.py
task:
  title: Wire `petri --version` into the CLI
  objective: Add an eager `--version` flag to the Typer app that prints `petri <version>` and exits 0,
    plus a test covering it.
  constraints:
  - Use the exact Typer pattern from the issue body (`@app.callback()` with `is_eager=True` and `typer.Exit()`)
  - Import `petri.__version__` lazily inside the callback to avoid import-time side effects
  - Test must use `CliRunner`, assert output contains the version string, and run offline (no network/provider
    calls)
  - Keep changes minimal; do not add per-subcommand version flags or a `version` subcommand
