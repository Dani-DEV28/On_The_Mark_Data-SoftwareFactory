design_notes: "## Overview\nImplement Pi harness by introducing a new adapter module for RPC transport\
  \ and PiModel, a shared error taxonomy, a deterministic fake stub, and wiring into engine/CLI. Strictly\
  \ follow PR #119 protocol contract (LF-JSONL framing, serial execution, error channels). Defer `petri\
  \ init` default flip and advanced usage/cost parsing per scope tradeoff.\n\n## File Changes\n- petri/errors.py:\
  \ Create. Add `PiError` taxonomy (e.g., `PiTransportError`, `PiProtocolError`, `PiGenerationError`)\
  \ and retry core logic. Shared with claude-code adapter.\n- petri/adapters/pi_transport.py: Create.\
  \ Spawns `pi --mode rpc`, manages long-lived session, handles LF-JSONL framing, serial request/response,\
  \ error mapping to taxonomy.\n- petri/adapters/pi_model.py: Create. Implements pydantic-ai `Model` interface\
  \ over `PiTransport`. Handles request mapping, tool policy, structured output, usage/cost capture (basic),\
  \ and `stopReason: error` channel.\n- petri/engine/harness.py: Modify. Add `check_pi()` preflight (binary\
  \ existence, version). Add `resolve_harness()` factory to map `harness:` block to `PiModel`.\n- petri/engine/bridge.py:\
  \ Modify. Implement four decomposition-path methods on Agents. Enforce `assess_cell` verdict discipline\
  \ and `match_evidence` logic.\n- petri/cli/init.py: Modify. Update defaults to use pi harness (deferred\
  \ per tradeoff; mark as TODO).\n- petri/cli/seed.py, petri/cli/grow.py: Modify. Wire harness resolution\
  \ and engine integration.\n- tests/fake_pi.py: Create. Offline stub implementing LF-JSONL framing, serial\
  \ command execution, deterministic response injection.\n- tests/test_pi_transport.py, tests/test_pi_model.py,\
  \ tests/test_harness.py: Create. Unit/integration tests against stub.\n- docs/: Update. Harness configuration,\
  \ troubleshooting, protocol reference.\n\n## Interfaces\n- class PiError(Exception): Base for taxonomy.\n\
  - class RetryCore: Configurable backoff, max attempts.\n- class PiTransport:\n    - __init__(self, binary_path:\
  \ str)\n    - async send_request(self, request: dict) -> dict\n    - async close(self)\n- class PiModel(Model):\n\
  \    - async request(self, prompt: str, tools: list) -> Response\n    - async stream(self, prompt: str,\
  \ tools: list) -> AsyncIterator[ResponseChunk]\n- def check_pi() -> bool: Preflight validation.\n- def\
  \ resolve_harness(config: dict) -> Model: Factory.\n- class Bridge:\n    - async decompose_task(self,\
  \ task: str) -> list\n    - async assess_cell(self, cell: dict) -> Verdict\n    - async match_evidence(self,\
  \ evidence: list) -> list\n\n## Patterns\n- Adapter Pattern: `PiTransport` and `PiModel` isolate pi-specific\
  \ logic.\n- Factory Pattern: `resolve_harness()` selects model based on config.\n- Retry Pattern: `RetryCore`\
  \ handles transient transport failures.\n- Stub Pattern: `fake_pi.py` enables deterministic testing\
  \ without network.\n- Serial Execution: Transport enforces one in-flight request per PR #119.\n\n##\
  \ Dependencies\n- pydantic-ai (existing)\n- subprocess (stdlib)\n- asyncio (stdlib)\n- json (stdlib)\n\
  - No new external libraries.\n\n## Risks\n- Protocol Mismatch: PR #119 details must be strictly followed;\
  \ any drift breaks integration.\n- Process Management: Spawning and managing `pi` process lifecycle\
  \ requires robust error handling for drops/crashes.\n- Integration Complexity: Wiring into pydantic-ai\
  \ and existing engine/CLI risks regressions; extensive testing needed.\n- Edge Cases: Malformed LF-JSONL\
  \ frames, partial writes, and `stopReason: error` must be handled gracefully.\n- Scope Creep: Deferring\
  \ `petri init` default and advanced usage/cost parsing is acceptable but must be tracked.\n- Testing\
  \ Coverage: Fake stub must cover all edge cases (drops, malformed frames, concurrent requests) to ensure\
  \ reliability.\n\n## Verdict\n- PASS\n"
approved: true
risks:
- Protocol mismatch with PR
- Process management complexity
- Integration regressions
- Edge case handling (malformed frames, drops)
- Scope creep (deferred items)
- Testing coverage gaps
