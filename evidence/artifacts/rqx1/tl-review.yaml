  - Use monkeypatch.setattr or unittest.mock.patch with the verified path
  - Maintain isolation and mock external I/O
  - Keep assertions focused on stop-gap trigger (stop file creation or termination state)
guidance: 1. Run grep -r "def grow_loop" corpus/petri/engine/ to find the exact signature and module.
  2. If it's a class method, patch the class. If it's a function, patch the module where it's imported.
  3. Replace the broken monkeypatch.setattr call with the verified path. 4. Ensure the mock raises the
