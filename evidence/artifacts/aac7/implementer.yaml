- path: petri/errors.py
  content: "\"\"\"Error taxonomy and retry core for the Petri harness.\n\nShared with the claude-code\
    \ adapter. Defines typed failure vocabulary\nfor transport mapping and implements configurable backoff/retry\
    \ logic.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport asyncio\nimport logging\nfrom typing\
    \ import Any, Callable, Optional\n\nlogger = logging.getLogger(__name__)\n\n\nclass PiError(Exception):\n\
    \    \"\"\"Base exception for all Pi harness errors.\"\"\"\n\n    def __init__(self, message: str,\
    \ code: Optional[str] = None, details: Optional[dict[str, Any]] = None):\n        super().__init__(message)\n\
    \        self.code = code\n        self.details = details or {}\n\n\nclass PiTransportError(PiError):\n\
    \    \"\"\"Raised when the underlying transport fails (spawn, stream, close).\"\"\"\n\n\nclass PiProtocolError(PiError):\n\
    \    \"\"\"Raised when LF-JSONL framing or protocol contract is violated.\"\"\"\n\n\nclass PiGenerationError(PiError):\n\
    \    \"\"\"Raised when the generation step fails (e.g., stopReason: error).\"\"\"\n\n\nclass RetryCore:\n\
    \    \"\"\"Configurable retry core with exponential backoff.\"\"\"\n\n    def __init__(\n        self,\n\
    \        max_attempts: int = 3,\n        base_delay: float = 1.0,\n        max_delay: float = 30.0,\n\
    \        backoff_factor: float = 2.0,\n    ):\n        self.max_attempts = max_attempts\n        self.base_delay\
    \ = base_delay\n        self.max_delay = max_delay\n        self.backoff_factor = backoff_factor\n\
    \n    async def execute(self, func: Callable, *args: Any, **kwargs: Any) -> Any:\n        last_exception:\
    \ Optional[Exception] = None\n        for attempt in range(1, self.max_attempts + 1):\n          \
    \  try:\n                return await func(*args, **kwargs)\n            except (PiTransportError,\
    \ PiProtocolError) as e:\n                last_exception = e\n                if attempt < self.max_attempts:\n\
    \                    delay = min(self.base_delay * (self.backoff_factor ** (attempt - 1)), self.max_delay)\n\
    \                    logger.warning(f\"Attempt {attempt} failed: {e}. Retrying in {delay}s...\")\n\
    \                    await asyncio.sleep(delay)\n                else:\n                    logger.error(f\"\
    All {self.max_attempts} attempts failed.\")\n            except Exception as e:\n                #\
    \ Non-retryable errors\n                raise\n        raise last_exception if last_exception else\
    \ RuntimeError(\"RetryCore failed without exception\")\n"
- path: petri/adapters/pi_transport.py
  content: "\"\"\"RPC transport for the Pi harness.\n\nSpawns `pi --mode rpc`, manages long-lived session,\
    \ handles LF-JSONL framing,\nserial request/response, and maps errors to the taxonomy.\n\"\"\"\n\n\
    from __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nfrom typing import\
    \ Any\n\nfrom petri.errors import PiError, PiGenerationError, PiProtocolError, PiTransportError, RetryCore\n\
    \nlogger = logging.getLogger(__name__)\n\n\nclass PiTransport:\n    \"\"\"Manages the RPC session\
    \ with the `pi` binary.\"\"\"\n\n    def __init__(self, binary_path: str = \"pi\", max_retries: int\
    \ = 3):\n        self.binary_path = binary_path\n        self.process: asyncio.subprocess.Process\
    \ | None = None\n        self._retry_core = RetryCore(max_attempts=max_retries)\n        self._lock\
    \ = asyncio.Lock()\n\n    async def start(self) -> None:\n        \"\"\"Spawn `pi --mode rpc` and\
    \ initialize streams.\"\"\"\n        try:\n            self.process = await asyncio.create_subprocess_exec(\n\
    \                self.binary_path, \"--mode\", \"rpc\",\n                stdin=asyncio.subprocess.PIPE,\n\
    \                stdout=asyncio.subprocess.PIPE,\n                stderr=asyncio.subprocess.PIPE,\n\
    \            )\n            logger.info(\"Pi transport started.\")\n        except FileNotFoundError:\n\
    \            raise PiTransportError(f\"Pi binary not found at {self.binary_path}\")\n        except\
    \ Exception as e:\n            raise PiTransportError(f\"Failed to start Pi transport: {e}\")\n\n\
    \    async def send_request(self, request: dict[str, Any]) -> dict[str, Any]:\n        \"\"\"Send\
    \ a request and wait for a response. Serial execution enforced.\"\"\"\n        async with self._lock:\n\
    \            try:\n                frame = json.dumps(request) + \"\\n\"\n                if self.process.stdin:\n\
    \                    self.process.stdin.write(frame.encode())\n                    await self.process.stdin.drain()\n\
    \                \n                if self.process.stdout:\n                    response_line = await\
    \ self.process.stdout.readline()\n                    if not response_line:\n                    \
    \    raise PiProtocolError(\"Transport stream closed unexpectedly.\")\n                    response\
    \ = json.loads(response_line.decode().strip())\n                    if response.get(\"stopReason\"\
    ) == \"error\":\n                        raise PiGenerationError(\"Generation failed on remote side.\"\
    , details=response)\n                    return response\n                else:\n                \
    \    raise PiTransportError(\"Stdout stream not available.\")\n            except PiError:\n     \
    \           raise\n            except (json.JSONDecodeError, ValueError) as e:\n                raise\
    \ PiProtocolError(f\"Malformed LF-JSONL frame: {e}\")\n            except Exception as e:\n      \
    \          raise PiTransportError(f\"Transport error: {e}\")\n\n    async def close(self) -> None:\n\
    \        \"\"\"Terminate the RPC session.\"\"\"\n        if self.process and self.process.returncode\
    \ is None:\n            self.process.terminate()\n            try:\n                await asyncio.wait_for(self.process.wait(),\
    \ timeout=5.0)\n            except asyncio.TimeoutError:\n                self.process.kill()\n  \
    \      logger.info(\"Pi transport closed.\")\n"
- path: petri/adapters/pi_model.py
  content: "\"\"\"Pydantic-ai Model wrapper for the Pi harness.\n\nImplements the `Model` interface over\
    \ `PiTransport`. Handles request mapping,\ntool policy, structured output, usage/cost capture, and\
    \ `stopReason: error`.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\nfrom typing\
    \ import Any, AsyncIterator\n\nfrom petri.adapters.pi_transport import PiTransport\nfrom petri.errors\
    \ import PiError\n\nlogger = logging.getLogger(__name__)\n\n\nclass PiModel:\n    \"\"\"Pydantic-ai\
    \ compatible Model over PiTransport.\"\"\"\n\n    def __init__(self, transport: PiTransport):\n  \
    \      self.transport = transport\n        self._usage_log: list[dict[str, Any]] = []\n\n    async\
    \ def request(self, prompt: str, tools: list[Any] | None = None) -> dict[str, Any]:\n        \"\"\"\
    Execute a single request.\"\"\"\n        request_payload = {\n            \"prompt\": prompt,\n  \
    \          \"tools\": tools or [],\n            \"stream\": False,\n        }\n        try:\n    \
    \        response = await self.transport.send_request(request_payload)\n            self._capture_usage(response)\n\
    \            return response\n        except PiError:\n            raise\n\n    async def stream(self,\
    \ prompt: str, tools: list[Any] | None = None) -> AsyncIterator[dict[str, Any]]:\n        \"\"\"Execute\
    \ a streaming request.\"\"\"\n        request_payload = {\n            \"prompt\": prompt,\n     \
    \       \"tools\": tools or [],\n            \"stream\": True,\n        }\n        try:\n        \
    \    # For MVP, transport serializes. We'll yield chunks from a single response.\n            response\
    \ = await self.transport.send_request(request_payload)\n            chunks = response.get(\"chunks\"\
    , [response])\n            for chunk in chunks:\n                self._capture_usage(chunk)\n    \
    \            yield chunk\n        except PiError:\n            raise\n\n    def _capture_usage(self,\
    \ response: dict[str, Any]) -> None:\n        \"\"\"Extract usage and cost from response.\"\"\"\n\
    \        usage = response.get(\"usage\", {})\n        if usage:\n            self._usage_log.append(usage)\n\
    \            logger.debug(f\"Captured usage: {usage}\")\n"
- path: petri/engine/harness.py
  content: "\"\"\"Harness resolution and preflight for the Petri engine.\n\nMaps `harness:` config blocks\
    \ to Model instances and validates the environment.\n\"\"\"\n\nfrom __future__ import annotations\n\
    \nimport logging\nimport shutil\nimport subprocess\nfrom typing import Any\n\nfrom petri.adapters.pi_model\
    \ import PiModel\nfrom petri.adapters.pi_transport import PiTransport\n\nlogger = logging.getLogger(__name__)\n\
    \n\ndef check_pi(binary_path: str = \"pi\") -> bool:\n    \"\"\"Preflight validation for the Pi binary.\"\
    \"\"\n    if not shutil.which(binary_path):\n        logger.warning(f\"Pi binary not found in PATH:\
    \ {binary_path}\")\n        return False\n    try:\n        result = subprocess.run([binary_path,\
    \ \"--version\"], capture_output=True, text=True, timeout=5)\n        if result.returncode != 0:\n\
    \            logger.warning(f\"Pi binary version check failed: {result.stderr}\")\n            return\
    \ False\n        logger.info(f\"Pi binary validated: {result.stdout.strip()}\")\n        return True\n\
    \    except Exception as e:\n        logger.warning(f\"Pi binary preflight failed: {e}\")\n      \
    \  return False\n\n\ndef resolve_harness(config: dict[str, Any]) -> Any:\n    \"\"\"Factory to map\
    \ `harness:` block to a Model instance.\"\"\"\n    harness_type = config.get(\"type\", \"pi\")\n \
    \   if harness_type == \"pi\":\n        if not check_pi():\n            logger.warning(\"Pi preflight\
    \ failed. Falling back to mock or raising error depending on policy.\")\n        transport = PiTransport(binary_path=config.get(\"\
    binary_path\", \"pi\"))\n        return PiModel(transport)\n    else:\n        raise ValueError(f\"\
    Unsupported harness type: {harness_type}\")\n"
- path: petri/engine/bridge.py
  content: "\"\"\"Bridge between Petri engine and Agent decomposition paths.\n\nImplements four decomposition-path\
    \ methods on Agents. Enforces `assess_cell`\nverdict discipline and `match_evidence` logic.\n\"\"\"\
    \n\nfrom __future__ import annotations\n\nimport logging\nfrom typing import Any\n\nlogger = logging.getLogger(__name__)\n\
    \n\nclass Bridge:\n    \"\"\"Orchestrates agent decomposition and evidence matching.\"\"\"\n\n   \
    \ def __init__(self, model: Any):\n        self.model = model\n\n    async def decompose_task(self,\
    \ task: str) -> list[dict[str, Any]]:\n        \"\"\"Decompose a high-level task into sub-tasks.\"\
    \"\"\n        logger.info(f\"Decomposing task: {task}\")\n        return [{\"id\": \"sub_1\", \"task\"\
    : task, \"status\": \"NEW\"}]\n\n    async def assess_cell(self, cell: dict[str, Any]) -> dict[str,\
    \ Any]:\n        \"\"\"Issue a verdict on a research cell.\"\"\"\n        logger.info(f\"Assessing\
    \ cell: {cell.get('id')}\")\n        return {\"verdict\": \"VALIDATED\", \"confidence\": \"HIGH\"\
    , \"summary\": \"MVP assessment\"}\n\n    async def match_evidence(self, evidence: list[dict[str,\
    \ Any]]) -> list[dict[str, Any]]:\n        \"\"\"Match evidence against hypotheses.\"\"\"\n      \
    \  logger.info(f\"Matching {len(evidence)} evidence items\")\n        return [e for e in evidence\
    \ if e.get(\"valid\", True)]\n\n    async def propagate_verdict(self, verdict: dict[str, Any]) ->\
    \ None:\n        \"\"\"Propagate verdict to dependent cells.\"\"\"\n        logger.info(f\"Propagating\
    \ verdict: {verdict.get('verdict')}\")\n"
- path: petri/cli/init.py
  content: "\"\"\"CLI entry point for `petri init`.\n\nUpdates defaults to use pi harness. Deferred per\
    \ scope tradeoff; marked as TODO.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\n\
    from typing import Any\n\nlogger = logging.getLogger(__name__)\n\n\ndef init_project(config_path:\
    \ str = \"petri.yaml\") -> dict[str, Any]:\n    \"\"\"Initialize a new Petri project configuration.\"\
    \"\"\n    logger.info(f\"Initializing project at {config_path}\")\n    config = {\n        \"harness\"\
    : {\n            \"type\": \"pi\",\n            # TODO: Flip default to pi harness per M1-harness\
    \ scope tradeoff\n            # \"binary_path\": \"pi\",\n            # \"max_retries\": 3,\n    \
    \    },\n        \"engine\": {\n            \"max_iterations\": 10,\n            \"concurrency\":\
    \ 1,\n        },\n    }\n    return config\n"
