# OpenClaw Agents — Tool Definitions
# Tools available to all factory agents

tools:
  kata:
    description: Interact with the kata board (local-first issue tracker)
    commands:
      - kata init                          # bind workspace
      - kata create "<description>"        # create issue (prints short id)
      - kata list                          # list open issues
      - kata show <id>                     # inspect by short id
      - kata claim <id>                    # claim work
      - kata close <id> --done --message "<evidence>" --commit <sha>
      - kata tui                           # interactive browser
      - kata quickstart                    # agent operating contract
    flags:
      - --agent                            # machine-readable output for agents
      - --json                             # raw JSON output

  git:
    description: Git operations (DevOps+QA only)
    restricted_to: devops-qa
    commands:
      - git add
      - git commit
      - git push
      - git branch
      - git merge
      - git log

  sandbox:
    description: Sandbox execution (DevOps+QA only)
    restricted_to: devops-qa
    commands:
      - sandbox exec --network-denied <command>
      - sandbox status

  fs:
    description: File system operations
    commands:
      - read
      - write
      - list
      - search
