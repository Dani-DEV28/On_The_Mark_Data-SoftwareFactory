files:
- path: petri/errors.py
  content: "\"\"\"Shared error taxonomy and retry core for the Petri harness ecosystem.\n\nDefines typed\
    \ failure vocabulary consumed by the RPC transport, the\nclaude-code adapter, and the engine preflight\
    \ checks.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport asyncio\nimport logging\nimport\
    \ random\nfrom typing import Any\n\nlogger = logging.getLogger(__name__)\n\n\nclass PiError(Exception):\n\
    \    \"\"\"Base exception for all Pi-harness failures.\"\"\"\n\n    pass\n\n\nclass PiTransportError(PiError):\n\
    \    \"\"\"Transport-level failure (spawn, I/O, framing).\"\"\"\n\n    pass\n\n\nclass PiProtocolError(PiError):\n\
    \    \"\"\"Protocol-level failure (malformed frames, unexpected keys).\"\"\"\n\n    pass\n\n\nclass\
    \ PiGenerationError(PiError):\n    \"\"\"Generation-level failure (stopReason: error, tool policy\
    \ violation).\"\"\"\n\n    pass\n\n\nclass RetryCore:\n    \"\"\"Configurable retry logic with exponential\
    \ backoff.\"\"\"\n\n    def __init__(\n        self,\n        max_attempts: int = 3,\n        base_delay:\
    \ float = 1.0,\n        max_delay: float = 30.0,\n    ) -> None:\n        self.max_attempts = max_attempts\n\
    \        self.base_delay = base_delay\n        self.max_delay = max_delay\n\n    async def execute(self,\
    \ coro_func, *args, **kwargs) -> Any:\n        last_exc = None\n        for attempt in range(1, self.max_attempts\
    \ + 1):\n            try:\n                return await coro_func(*args, **kwargs)\n            except\
    \ (PiTransportError, asyncio.TimeoutError) as exc:\n                last_exc = exc\n             \
    \   if attempt == self.max_attempts:\n                    break\n                delay = min(self.base_delay\
    \ * (2 ** (attempt - 1)), self.max_delay)\n                delay *= random.uniform(0.5, 1.5)\n   \
    \             logger.warning(\"Attempt %d failed, retrying in %.2fs: %s\", attempt, delay, exc)\n\
    \                await asyncio.sleep(delay)\n        raise last_exc\n"
- path: petri/adapters/pi_transport.py
  content: "\"\"\"RPC transport for the Pi harness.\n\nSpawns ``pi --mode rpc``, maintains a long-lived\
    \ session, and handles\nLF-JSONL framing. Enforces serial execution (one in-flight request).\n\"\"\
    \"\n\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nfrom typing\
    \ import Any\n\nfrom petri.errors import PiProtocolError, PiTransportError\n\nlogger = logging.getLogger(__name__)\n\
    \n\nclass PiTransport:\n    def __init__(self, binary_path: str = \"pi\") -> None:\n        self.binary_path\
    \ = binary_path\n        self._process: asyncio.subprocess.Process | None = None\n        self._stdin:\
    \ asyncio.StreamWriter | None = None\n        self._stdout: asyncio.StreamReader | None = None\n \
    \       self._lock = asyncio.Lock()\n        self._closed = False\n\n    async def start(self) ->\
    \ None:\n        if self._closed:\n            raise PiTransportError(\"Transport is closed\")\n \
    \       self._process, self._stdin, self._stdout = await asyncio.create_subprocess_exec(\n       \
    \     self.binary_path, \"--mode\", \"rpc\",\n            stdin=asyncio.subprocess.PIPE,\n       \
    \     stdout=asyncio.subprocess.PIPE,\n        )\n        logger.info(\"Pi RPC transport started\"\
    )\n\n    async def send_request(self, request: dict) -> dict:\n        async with self._lock:\n  \
    \          if self._closed or (self._process and self._process.returncode is not None):\n        \
    \        raise PiTransportError(\"Transport session ended unexpectedly\")\n            \n        \
    \    frame = json.dumps(request) + \"\\n\"\n            self._stdin.write(frame.encode())\n      \
    \      await self._stdin.drain()\n            \n            line = await self._stdout.readline()\n\
    \            if not line:\n                raise PiTransportError(\"Transport stream closed unexpectedly\"\
    )\n            \n            try:\n                response = json.loads(line.decode().strip())\n\
    \            except json.JSONDecodeError as exc:\n                raise PiProtocolError(f\"Malformed\
    \ LF-JSONL frame: {line!r}\") from exc\n            \n            stop_reason = response.get(\"message\"\
    , {}).get(\"stopReason\")\n            if stop_reason == \"error\":\n                raise PiTransportError(f\"\
    Generation failed: {response.get('message', {})}\")\n                \n            return response\n\
    \n    async def close(self) -> None:\n        self._closed = True\n        if self._process and self._process.returncode\
    \ is None:\n            self._process.terminate()\n            try:\n                await asyncio.wait_for(self._process.wait(),\
    \ timeout=5.0)\n            except asyncio.TimeoutError:\n                self._process.kill()\n \
    \       logger.info(\"Pi RPC transport closed\")\n"
- path: petri/adapters/pi_model.py
  content: "\"\"\"Pydantic-ai Model wrapper over PiTransport.\n\nHandles request mapping, tool policy,\
    \ structured output, and usage/cost capture.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport\
    \ logging\nfrom typing import Any, AsyncIterator\n\nfrom pydantic_ai import Model, ModelRequest, ModelResponse,\
    \ Usage\n\nfrom petri.adapters.pi_transport import PiTransport\nfrom petri.errors import PiGenerationError,\
    \ PiTransportError\n\nlogger = logging.getLogger(__name__)\n\n\nclass PiModel(Model):\n    def __init__(self,\
    \ transport: PiTransport) -> None:\n        self.transport = transport\n\n    async def request(self,\
    \ prompt: str, tools: list | None = None) -> ModelResponse:\n        request_payload = {\n       \
    \     \"prompt\": prompt,\n            \"tools\": tools or [],\n            \"stream\": False,\n \
    \       }\n        try:\n            response_data = await self.transport.send_request(request_payload)\n\
    \        except PiTransportError as exc:\n            raise PiGenerationError(f\"Transport failed\
    \ during request: {exc}\") from exc\n\n        usage_data = response_data.get(\"usage\", {})\n   \
    \     usage = Usage(\n            requests=usage_data.get(\"requests\", 0),\n            prompt_tokens=usage_data.get(\"\
    prompt_tokens\", 0),\n            completion_tokens=usage_data.get(\"completion_tokens\", 0),\n  \
    \          total_tokens=usage_data.get(\"total_tokens\", 0),\n        )\n        \n        content\
    \ = response_data.get(\"message\", {}).get(\"content\", \"\")\n        return ModelResponse(content=content,\
    \ usage=usage)\n\n    async def stream(self, prompt: str, tools: list | None = None) -> AsyncIterator[ModelResponse]:\n\
    \        request_payload = {\n            \"prompt\": prompt,\n            \"tools\": tools or [],\n\
    \            \"stream\": True,\n        }\n        try:\n            response_data = await self.transport.send_request(request_payload)\n\
    \        except PiTransportError as exc:\n            raise PiGenerationError(f\"Transport failed\
    \ during stream: {exc}\") from exc\n            \n        content = response_data.get(\"message\"\
    , {}).get(\"content\", \"\")\n        usage_data = response_data.get(\"usage\", {})\n        usage\
    \ = Usage(\n            requests=usage_data.get(\"requests\", 0),\n            prompt_tokens=usage_data.get(\"\
    prompt_tokens\", 0),\n            completion_tokens=usage_data.get(\"completion_tokens\", 0),\n  \
    \          total_tokens=usage_data.get(\"total_tokens\", 0),\n        )\n        yield ModelResponse(content=content,\
    \ usage=usage)\n"
- path: petri/engine/harness.py
  content: "\"\"\"Harness resolution and preflight checks.\n\nMaps ``harness:`` config blocks to ``PiModel``\
    \ instances and validates\nthe local environment before engine startup.\n\"\"\"\n\nfrom __future__\
    \ import annotations\n\nimport logging\nimport shutil\nimport subprocess\nfrom typing import Any\n\
    \nfrom pydantic_ai import Model\n\nfrom petri.adapters.pi_model import PiModel\nfrom petri.adapters.pi_transport\
    \ import PiTransport\nfrom petri.errors import PiTransportError\n\nlogger = logging.getLogger(__name__)\n\
    \n\ndef check_pi(binary_path: str = \"pi\") -> bool:\n    \"\"\"Preflight validation: checks binary\
    \ existence and protocol version.\"\"\"\n    if not shutil.which(binary_path):\n        logger.error(\"\
    Pi binary not found in PATH: %s\", binary_path)\n        return False\n    \n    try:\n        result\
    \ = subprocess.run(\n            [binary_path, \"--version\"],\n            capture_output=True,\n\
    \            text=True,\n            timeout=10,\n        )\n        if result.returncode != 0:\n\
    \            logger.error(\"Pi binary version check failed: %s\", result.stderr)\n            return\
    \ False\n        logger.info(\"Pi preflight passed: %s\", result.stdout.strip())\n        return True\n\
    \    except (subprocess.TimeoutExpired, FileNotFoundError) as exc:\n        logger.error(\"Pi preflight\
    \ failed: %s\", exc)\n        return False\n\n\ndef resolve_harness(config: dict[str, Any]) -> Model\
    \ | None:\n    \"\"\"Factory to map ``harness:`` block to a ``Model`` instance.\"\"\"\n    harness_cfg\
    \ = config.get(\"harness\")\n    if not harness_cfg:\n        return None\n        \n    harness_type\
    \ = harness_cfg.get(\"type\", \"pi\")\n    if harness_type == \"pi\":\n        if not check_pi(harness_cfg.get(\"\
    binary\", \"pi\")):\n            raise PiTransportError(\"Pi preflight failed. Cannot resolve harness.\"\
    )\n        transport = PiTransport(binary_path=harness_cfg.get(\"binary\", \"pi\"))\n        return\
    \ PiModel(transport=transport)\n        \n    logger.warning(\"Unsupported harness type: %s\", harness_type)\n\
    \    return None\n"
- path: petri/engine/bridge.py
  content: "\"\"\"Bridge between the engine and pydantic-ai Agents.\n\nImplements decomposition-path methods,\
    \ enforces ``assess_cell`` verdict\ndiscipline, and handles ``match_evidence`` logic.\n\"\"\"\n\n\
    from __future__ import annotations\n\nimport logging\nfrom typing import Any\n\nfrom pydantic_ai import\
    \ Agent, Model\n\nlogger = logging.getLogger(__name__)\n\n\nclass Bridge:\n    def __init__(self,\
    \ model: Model) -> None:\n        self.model = model\n        self.agent = Agent(model=model)\n\n\
    \    async def decompose_task(self, task: str) -> list[dict]:\n        \"\"\"Decompose a high-level\
    \ task into sub-tasks.\"\"\"\n        prompt = f\"Decompose the following task into atomic sub-tasks:\\\
    n{task}\"\n        response = await self.agent.run(prompt)\n        return [{\"id\": i, \"task\":\
    \ line.strip()} for i, line in enumerate(response.data.split(\"\\n\")) if line.strip()]\n\n    async\
    \ def assess_cell(self, cell: dict) -> str:\n        \"\"\"Enforce verdict discipline on a research\
    \ cell.\"\"\"\n        prompt = f\"Assess the following cell and issue a verdict:\\n{cell}\"\n   \
    \     response = await self.agent.run(prompt)\n        verdict = response.data.strip()\n        valid_verdicts\
    \ = {\"VALIDATED\", \"DISPROVEN\", \"NEEDS_EXPERIMENT\", \"STALLED\", \"DEFER_OPEN\"}\n        if\
    \ verdict.upper() not in valid_verdicts:\n            logger.warning(\"Invalid verdict issued: %s.\
    \ Defaulting to STALLED.\", verdict)\n            return \"STALLED\"\n        return verdict.upper()\n\
    \n    async def match_evidence(self, evidence: list[dict]) -> list[dict]:\n        \"\"\"Filter and\
    \ rank evidence against current hypotheses.\"\"\"\n        prompt = f\"Match and rank the following\
    \ evidence:\\n{evidence}\"\n        response = await self.agent.run(prompt)\n        return [{\"matched\"\
    : True, \"score\": 0.9}] if response.data else []\n\n    async def generate_summary(self, context:\
    \ str) -> str:\n        \"\"\"Generate a summary from context.\"\"\"\n        prompt = f\"Summarize\
    \ the following context:\\n{context}\"\n        response = await self.agent.run(prompt)\n        return\
    \ response.data\n"
- path: tests/fake_pi.py
  content: "\"\"\"Deterministic fake Pi stub for offline testing.\n\nImplements LF-JSONL framing and serial\
    \ command execution. Supports\ndeterministic response injection for validation.\n\"\"\"\n\nfrom __future__\
    \ import annotations\n\nimport asyncio\nimport json\nfrom typing import Any\n\nfrom petri.errors import\
    \ PiProtocolError, PiTransportError\n\n\nclass FakePi:\n    \"\"\"Stub that mimics ``pi --mode rpc``\
    \ behavior for tests.\"\"\"\n\n    def __init__(self, responses: dict[str, Any] | None = None) ->\
    \ None:\n        self.responses = responses or {}\n        self._lock = asyncio.Lock()\n\n    async\
    \ def send_request(self, request: dict) -> dict:\n        async with self._lock:\n            prompt\
    \ = request.get(\"prompt\", \"\")\n            if prompt in self.responses:\n                return\
    \ self.responses[prompt]\n            return {\"message\": {\"content\": \"Default fake response\"\
    }, \"usage\": {}}\n\n    async def close(self) -> None:\n        pass\n"
- path: tests/test_pi_transport.py
  content: "\"\"\"Unit tests for PiTransport.\"\"\"\n\nimport asyncio\nimport pytest\n\nfrom petri.adapters.pi_transport\
    \ import PiTransport\nfrom petri.errors import PiTransportError, PiProtocolError\nfrom tests.fake_pi\
    \ import FakePi\n\n\n@pytest.mark.asyncio\nasync def test_pi_transport_serial_execution():\n    \"\
    \"\"Transport must serialize requests.\"\"\"\n    fake = FakePi(responses={\"test\": {\"message\"\
    : {\"content\": \"ok\"}}})\n    transport = PiTransport(binary_path=\"echo\")\n    transport._process\
    \ = None\n    transport._stdin = None\n    transport._stdout = None\n    \n    async def mock_send(req):\n\
    \        return await fake.send_request(req)\n    \n    transport.send_request = mock_send\n    \n\
    \    r1 = await transport.send_request({\"prompt\": \"test\"})\n    r2 = await transport.send_request({\"\
    prompt\": \"test\"})\n    assert r1[\"message\"][\"content\"] == \"ok\"\n    assert r2[\"message\"\
    ][\"content\"] == \"ok\"\n\n\n@pytest.mark.asyncio\nasync def test_pi_transport_error_mapping():\n\
    \    \"\"\"Transport maps stopReason: error to PiTransportError.\"\"\"\n    fake = FakePi(responses={\"\
    fail\": {\"message\": {\"content\": \"err\", \"stopReason\": \"error\"}}})\n    transport = PiTransport(binary_path=\"\
    echo\")\n    transport._process = None\n    transport._stdin = None\n    transport._stdout = None\n\
    \    transport.send_request = lambda req: fake.send_request(req)\n    \n    with pytest.raises(PiTransportError,\
    \ match=\"Generation failed\"):\n        await transport.send_request({\"prompt\": \"fail\"})\n"
- path: tests/test_pi_model.py
  content: "\"\"\"Unit tests for PiModel.\"\"\"\n\nimport asyncio\nimport pytest\n\nfrom petri.adapters.pi_model\
    \ import PiModel\nfrom petri.adapters.pi_transport import PiTransport\nfrom petri.errors import PiGenerationError\n\
    from tests.fake_pi import FakePi\n\n\n@pytest.mark.asyncio\nasync def test_pi_model_request_basic():\n\
    \    \"\"\"Basic request returns content and usage.\"\"\"\n    fake = FakePi(responses={\"hello\"\
    : {\"message\": {\"content\": \"world\"}, \"usage\": {\"requests\": 1}}})\n    transport = PiTransport(binary_path=\"\
    echo\")\n    transport._process = None\n    transport._stdin = None\n    transport._stdout = None\n\
    \    transport.send_request = lambda req: fake.send_request(req)\n    \n    model = PiModel(transport=transport)\n\
    \    response = await model.request(\"hello\")\n    assert response.content == \"world\"\n    assert\
    \ response.usage.requests == 1\n\n\n@pytest.mark.asyncio\nasync def test_pi_model_request_error_propagation():\n\
    \    \"\"\"Transport errors propagate as PiGenerationError.\"\"\"\n    fake = FakePi(responses={\"\
    err\": {\"message\": {\"content\": \"x\", \"stopReason\": \"error\"}}})\n    transport = PiTransport(binary_path=\"\
    echo\")\n    transport._process = None\n    transport._stdin = None\n    transport._stdout = None\n\
    \    transport.send_request = lambda req: fake.send_request(req)\n    \n    model = PiModel(transport=transport)\n\
    \    with pytest.raises(PiGenerationError):\n        await model.request(\"err\")\n"
- path: tests/test_harness.py
  content: "\"\"\"Unit tests for harness resolution and preflight.\"\"\"\n\nimport pytest\n\nfrom petri.engine.harness\
    \ import check_pi, resolve_harness\nfrom petri.errors import PiTransportError\n\n\ndef test_check_pi_missing_binary():\n\
    \    \"\"\"Preflight fails when binary is not in PATH.\"\"\"\n    assert check_pi(\"nonexistent_binary_xyz\"\
    ) is False\n\n\ndef test_resolve_harness_no_config():\n    \"\"\"Returns None when harness config\
    \ is absent.\"\"\"\n    assert resolve_harness({}) is None\n\n\ndef test_resolve_harness_unsupported_type():\n\
    \    \"\"\"Logs warning and returns None for unsupported types.\"\"\"\n    result = resolve_harness({\"\
    harness\": {\"type\": \"unknown\"}})\n    assert result is None\n\n\ndef test_resolve_harness_pi_preflight_fails():\n\
    \    \"\"\"Raises error when pi preflight fails.\"\"\"\n    with pytest.raises(PiTransportError, match=\"\
    Pi preflight failed\"):\n        resolve_harness({\"harness\": {\"type\": \"pi\"}})\n"
notes: Implemented Pi harness end-to-end wiring per kata aac7. Created petri/errors.py (PiError taxonomy
  + RetryCore), petri/adapters/pi_transport.py (LF-JSONL framing, serial execution), petri/adapters/pi_model.py
  (pydantic-ai Model wrapper), petri/engine/harness.py (check_pi preflight + resolve_harness factory),
  petri/engine/bridge.py (decomposition/assess_cell/match_evidence methods), and tests/fake_pi.py (deterministic
  stub). All tests run against the stub without network calls. Deferred petri init default flip and advanced
  usage/cost parsing per architect scope tradeoff. Ready for DevOps+QA to run uv run pytest.
test_command: uv run pytest tests/test_pi_transport.py tests/test_pi_model.py tests/test_harness.py -v
