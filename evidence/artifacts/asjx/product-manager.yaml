acceptance_criteria:
- petri --version prints output in format 'petri <version>' and exits with code 0
- Printed version matches petri.__version__ (resolved from package metadata)
- Flag works when executed from any directory without a .petri/ project
- Test uses Typer CliRunner, asserts output contains version string, and runs fully offline
- No regressions in existing CLI integration tests
- Implementation uses the specified Typer pattern (@app.callback with is_eager=True and typer.Exit)
edge_cases:
- Running --version alongside other flags (e.g., --version --help) should still print version and exit
- Running --version with a subcommand (e.g., petri --version init) should print version and exit without
  running the subcommand
- Handling cases where package metadata is unavailable (should fail gracefully or raise a clear error,
  though setuptools-scm typically guarantees availability)
subtasks:
- order: 1
  title: Implement eager --version flag in petri CLI
  depends_on: none
  acceptance_criteria:
  - Add @app.callback() with --version option using is_eager=True and typer.Exit()
  - Import petri.__version__ lazily inside the callback to avoid import-time side effects
  - typer.echo outputs 'petri {__version__}' and raises typer.Exit() when flag is triggered
  - No changes to existing subcommand logic or dependency injection
- order: 2
  title: Add integration test for --version flag
  depends_on: subtask-1
  acceptance_criteria:
  - Test in tests/integration/test_cli.py uses CliRunner to invoke petri --version
  - Asserts exit code is 0 and output contains the expected version string
  - Test runs offline (no network/provider calls) and mocks remain intact
  - Test passes in isolation and alongside existing CLI tests
definition_of_done: CLI implementation merged, integration test passes locally and in CI, --version outputs
  correct metadata version and exits 0, works offline from any directory, and no regressions exist in
  the test suite.
