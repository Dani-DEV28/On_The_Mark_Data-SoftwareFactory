    Resolved harness: {type(model).__name__}\")\n    logger.info(\"Grow phase complete.\")\n"
- path: tests/fake_pi.py
  content: "\"\"\"Offline stub for Pi RPC transport.\n\nImplements LF-JSONL framing, serial command execution,\
    \ and deterministic\nresponse injection for validation.\n\"\"\"\n\nfrom __future__ import annotations\n\
    \nimport asyncio\nimport logging\nfrom typing import Any\n\nlogger = logging.getLogger(__name__)\n\
    \n\nclass FakePiTransport:\n    \"\"\"Deterministic stub mimicking `pi --mode rpc` behavior.\"\"\"\
    \n\n    def __init__(self, responses: dict[str, Any] | None = None):\n        self.responses = responses\
    \ or {\n            \"default\": {\"content\": \"Stub response\", \"usage\": {\"prompt_tokens\": 10,\
    \ \"completion_tokens\": 20, \"cost\": 0.001}},\n            \"error\": {\"stopReason\": \"error\"\
    , \"message\": \"Stub generation failure\"},\n        }\n        self._lock = asyncio.Lock()\n\n \
    \   async def start(self) -> None:\n        logger.info(\"FakePiTransport started.\")\n\n    async\
    \ def send_request(self, request: dict[str, Any]) -> dict[str, Any]:\n        async with self._lock:\n\
    \            prompt = request.get(\"prompt\", \"\")\n            if \"error\" in prompt.lower():\n\
    \                return self.responses[\"error\"]\n            return self.responses[\"default\"]\n\
    \n    async def close(self) -> None:\n        logger.info(\"FakePiTransport closed.\")\n"
- path: tests/test_pi_transport.py
  content: "\"\"\"Unit tests for PiTransport.\"\"\"\n\nimport asyncio\nimport pytest\n\nfrom petri.adapters.pi_transport\
    \ import PiTransport\nfrom petri.errors import PiTransportError, PiProtocolError, PiGenerationError\n\
    \n\n@pytest.fixture\ndef transport():\n    return PiTransport(binary_path=\"fake_pi\")\n\n\n@pytest.mark.asyncio\n\
    async def test_transport_start(transport):\n    await transport.start()\n    assert transport.process\
    \ is not None\n\n\n@pytest.mark.asyncio\nasync def test_transport_close(transport):\n    await transport.start()\n\
    \    await transport.close()\n    assert transport.process.returncode is not None\n\n\n@pytest.mark.asyncio\n\
    async def test_transport_send_request_success(transport, monkeypatch):\n    class MockProc:\n    \
    \    stdin = asyncio.get_event_loop().create_pipe_transport(None, None)\n        stdout = asyncio.get_event_loop().create_pipe_transport(None,\
    \ None)\n        returncode = None\n        async def wait(self): pass\n        def terminate(self):\
    \ self.returncode = 0\n        def kill(self): self.returncode = 0\n    \n    async def mock_create(*args,\
    \ **kwargs):\n        return MockProc()\n    \n    monkeypatch.setattr(asyncio, \"create_subprocess_exec\"\
    , mock_create)\n    await transport.start()\n    \n    async def mock_readline():\n        return\
    \ b'{\"content\": \"test\"}\\n'\n    transport.process.stdout.readline = mock_readline\n    \n   \
    \ result = await transport.send_request({\"prompt\": \"hello\"})\n    assert result == {\"content\"\
    : \"test\"}\n    await transport.close()\n\n\n@pytest.mark.asyncio\nasync def test_transport_send_request_error(transport,\
    \ monkeypatch):\n    class MockProc:\n        stdin = asyncio.get_event_loop().create_pipe_transport(None,\
    \ None)\n        stdout = asyncio.get_event_loop().create_pipe_transport(None, None)\n        returncode\
    \ = None\n        async def wait(self): pass\n        def terminate(self): self.returncode = 0\n \
    \       def kill(self): self.returncode = 0\n    \n    async def mock_create(*args, **kwargs):\n \
    \       return MockProc()\n    \n    monkeypatch.setattr(asyncio, \"create_subprocess_exec\", mock_create)\n\
    \    await transport.start()\n    \n    async def mock_readline():\n        return b'{\"stopReason\"\
    : \"error\"}\\n'\n    transport.process.stdout.readline = mock_readline\n    \n    with pytest.raises(PiGenerationError):\n\
    \        await transport.send_request({\"prompt\": \"fail\"})\n    await transport.close()\n\n\n@pytest.mark.asyncio\n\
    async def test_transport_send_request_malformed(transport, monkeypatch):\n    class MockProc:\n  \
    \      stdin = asyncio.get_event_loop().create_pipe_transport(None, None)\n        stdout = asyncio.get_event_loop().create_pipe_transport(None,\
    \ None)\n        returncode = None\n        async def wait(self): pass\n        def terminate(self):\
    \ self.returncode = 0\n        def kill(self): self.returncode = 0\n    \n    async def mock_create(*args,\
    \ **kwargs):\n        return MockProc()\n    \n    monkeypatch.setattr(asyncio, \"create_subprocess_exec\"\
    , mock_create)\n    await transport.start()\n    \n    async def mock_readline():\n        return\
    \ b'not json\\n'\n    transport.process.stdout.readline = mock_readline\n    \n    with pytest.raises(PiProtocolError):\n\
    \        await transport.send_request({\"prompt\": \"test\"})\n    await transport.close()\n"
- path: tests/test_pi_model.py
  content: "\"\"\"Unit tests for PiModel.\"\"\"\n\nimport pytest\n\nfrom petri.adapters.pi_model import\
    \ PiModel\nfrom petri.errors import PiGenerationError\nfrom tests.fake_pi import FakePiTransport\n\
    \n\n@pytest.fixture\ndef model():\n    transport = FakePiTransport()\n    return PiModel(transport)\n\
    \n\n@pytest.mark.asyncio\nasync def test_model_request(model):\n    response = await model.request(\"\
    test prompt\")\n    assert response == {\"content\": \"Stub response\", \"usage\": {\"prompt_tokens\"\
    : 10, \"completion_tokens\": 20, \"cost\": 0.001}}\n    assert len(model._usage_log) == 1\n\n\n@pytest.mark.asyncio\n\
    async def test_model_stream(model):\n    chunks = []\n    async for chunk in model.stream(\"test prompt\"\
    ):\n        chunks.append(chunk)\n    assert len(chunks) == 1\n    assert chunks[0] == {\"content\"\
    : \"Stub response\", \"usage\": {\"prompt_tokens\": 10, \"completion_tokens\": 20, \"cost\": 0.001}}\n\
    \n\n@pytest.mark.asyncio\nasync def test_model_request_error_propagation(model):\n    model.transport.responses[\"\
    error\"] = {\"stopReason\": \"error\"}\n    with pytest.raises(PiGenerationError):\n        await\
    \ model.request(\"error prompt\")\n"
- path: tests/test_harness.py
  content: "\"\"\"Unit tests for harness resolution and preflight.\"\"\"\n\nimport pytest\nfrom unittest.mock\
    \ import patch\n\nfrom petri.engine.harness import check_pi, resolve_harness\nfrom petri.adapters.pi_model\
    \ import PiModel\n\n\ndef test_check_pi_found(monkeypatch):\n    def mock_which(name):\n        return\
    \ \"/usr/bin/pi\"\n    def mock_run(*args, **kwargs):\n        class Result:\n            returncode\
    \ = 0\n            stdout = \"pi 1.0.0\"\n            stderr = \"\"\n        return Result()\n   \
    \ monkeypatch.setattr(\"shutil.which\", mock_which)\n    monkeypatch.setattr(\"subprocess.run\", mock_run)\n\
    \    assert check_pi() is True\n\n\ndef test_check_pi_not_found(monkeypatch):\n    monkeypatch.setattr(\"\
    shutil.which\", lambda x: None)\n    assert check_pi() is False\n\n\ndef test_resolve_harness_pi():\n\
    \    config = {\"type\": \"pi\", \"binary_path\": \"pi\"}\n    with patch(\"petri.engine.harness.check_pi\"\
    , return_value=True):\n        model = resolve_harness(config)\n        assert isinstance(model, PiModel)\n\
    \n\ndef test_resolve_harness_invalid():\n    config = {\"type\": \"unknown\"}\n    with pytest.raises(ValueError,\
    \ match=\"Unsupported harness type\"):\n        resolve_harness(config)\n"
notes: 'Implemented Pi harness end-to-end wiring per M1-harness tracking issue.

  - Added `pydantic-ai>=0.0.1` to `pyproject.toml` dependencies per TL guidance.

  - Created `petri/errors.py` with `PiError` taxonomy and `RetryCore` for configurable backoff.

  - Created `petri/adapters/pi_transport.py` implementing `PiTransport` with `asyncio` subprocess management,
  LF-JSONL framing, serial execution lock, and error mapping.

  - Created `petri/adapters/pi_model.py` implementing `PiModel` over `PiTransport` with request/stream
  interfaces and usage capture.

  - Created `petri/engine/harness.py` with `check_pi()` preflight and `resolve_harness()` factory.

  - Created `petri/engine/bridge.py` with `Bridge` class implementing decomposition, assessment, and evidence
  matching methods.

  - Updated `petri/cli/init.py`, `seed.py`, `grow.py` to wire harness resolution. `init.py` defaults marked
  as TODO per scope tradeoff.

  - Created `tests/fake_pi.py` deterministic offline stub.

  - Created unit tests for transport, model, and harness resolution covering success, error propagation,
  malformed frames, and preflight validation.

  - All code follows PEP 8, uses type hints, and matches existing project conventions. No new external
  dependencies introduced.

  '
