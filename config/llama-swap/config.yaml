# llama-swap Configuration — Software Factory (GB10)
# One OpenAI-compatible endpoint on :9292; llama-swap hot-swaps vLLM containers.
# Qwen models need vllm/vllm-openai:latest (qwen3_5_moe arch); Nemotrons use the NVIDIA 26.01 image.
# Start: llama-swap --config config/llama-swap/config.yaml --listen :9292
healthCheckTimeout: 900
startPort: 10001
logLevel: info

models:
  "qwen3.6-35b-a3b-fp8":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      docker run --gpus all --ulimit memlock=-1 --ulimit stack=67108864 --name lsw-qwen35b
      --init --rm -p ${PORT}:8000 --ipc=host
      -v /home/dell/factory/software-factory/models/qwen3.6/Qwen3.6-35B-A3B-FP8:/model
      --entrypoint vllm vllm/vllm-openai:latest
      serve /model --served-model-name qwen3.6-35b-a3b-fp8
      --max-model-len 32768 --gpu-memory-utilization 0.85
      --trust-remote-code
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
    cmdStop: docker stop lsw-qwen35b

  "qwen3.6-27b":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      docker run --gpus all --ulimit memlock=-1 --ulimit stack=67108864 --name lsw-qwen27b
      --init --rm -p ${PORT}:8000 --ipc=host
      -v /home/dell/factory/software-factory/models/qwen3.6/Qwen3.6-27B:/model
      --entrypoint vllm vllm/vllm-openai:latest
      serve /model --served-model-name qwen3.6-27b
      --max-model-len 32768 --gpu-memory-utilization 0.85
      --trust-remote-code
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
    cmdStop: docker stop lsw-qwen27b

  "nemotron-nano-30b":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      docker run --gpus all --ulimit memlock=-1 --ulimit stack=67108864 --name lsw-nemotron-nano
      --init --rm -p ${PORT}:8000 --ipc=host
      -v /home/dell/hack/models/nemotron-3-nano-30b-fp8:/model
      nvcr.io/nvidia/vllm:26.01-py3
      vllm serve /model --served-model-name nemotron-nano-30b
      --tensor-parallel-size 1 --kv-cache-dtype fp8 --max-model-len 16384
      --gpu-memory-utilization 0.85 --trust-remote-code
      --mamba-ssm-cache-dtype float32 --reasoning-parser deepseek_r1
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
    cmdStop: docker stop lsw-nemotron-nano

  "nemotron-super-120b":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      docker run --gpus all --ulimit memlock=-1 --ulimit stack=67108864 --name lsw-nemotron-super
      --init --rm -p ${PORT}:8000 --ipc=host
      -v /home/dell/hack/models/nemotron-3-super-120b-nvfp4:/model
      nvcr.io/nvidia/vllm:26.01-py3
      vllm serve /model --served-model-name nemotron-super-120b
      --tensor-parallel-size 1 --max-model-len 16384
      --gpu-memory-utilization 0.85 --trust-remote-code
      --mamba-ssm-cache-dtype float32 --reasoning-parser deepseek_r1
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
    cmdStop: docker stop lsw-nemotron-super
