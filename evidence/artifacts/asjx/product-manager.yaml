acceptance_criteria:
- petri --version prints the version string (e.g., 'petri 0.3.7') and exits with code 0.
- The printed version matches petri.__version__ (resolved via importlib.metadata.version('petri-grow')).
- The flag works eagerly without requiring a valid .petri/ project directory or subcommand.
- An integration test exists in tests/integration/test_cli.py using Typer's CliRunner that asserts the
  output contains the version string.
- Implementation uses @app.callback() with is_eager=True and raises typer.Exit() after printing.
edge_cases:
- Running petri --version alongside other flags or subcommands should still print the version and exit
  immediately, ignoring all other arguments.
- If petri-grow metadata is unavailable or malformed (e.g., during local dev installs), the callback should
  fail gracefully or print a fallback without crashing the CLI.
- Version strings containing non-standard characters or dev markers (e.g., 0.0.0.dev1) should print exactly
  as resolved without breaking output formatting.
subtasks:
- Implement eager --version callback in petri/cli/__init__.py using @app.callback() and typer.Option with
  is_eager=True.
- Add integration test in tests/integration/test_cli.py using CliRunner to verify output matches petri.__version__
  and exit code is 0.
- 'Run local verification: execute petri --version and compare output with importlib.metadata.version(''petri-grow'').'
- Execute full offline test suite to confirm no regressions in existing CLI commands or project initialization
  logic.
definition_of_done: Code changes are committed to petri/cli/__init__.py and tests/integration/test_cli.py.
  The petri --version command prints the correct version and exits with code 0. The new integration test
  passes locally and in CI. No regressions exist in existing CLI functionality or project initialization.
  All acceptance criteria are met.
