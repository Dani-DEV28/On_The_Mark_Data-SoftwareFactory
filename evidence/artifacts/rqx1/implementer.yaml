files:
- path: tests/unit/test_processor_stop_file.py
  content: "\"\"\"Tests for the cross-process stop sentinel helpers in ``processor``.\n\nThese helpers\
    \ live alongside the in-process ``threading.Event`` stop\nsignal and let the CLI ``petri stop`` command\
    \ halt a detached ``petri\ngrow`` worker running in a separate process.\n\"\"\"\n\nfrom __future__\
    \ import annotations\n\nimport pytest\n\n\n@pytest.fixture\ndef petri_dir(tmp_path):\n    \"\"\"Return\
    \ a fresh empty .petri/ directory as a Path.\"\"\"\n    directory = tmp_path / \".petri\"\n    directory.mkdir()\n\
    \    return directory\n\n\ndef test_request_stop_file_creates_file(petri_dir):\n    from petri.engine.processor\
    \ import request_stop_file\n\n    stop_path = request_stop_file(petri_dir)\n    assert stop_path.exists()\n\
    \    assert stop_path.name == \".stop\"\n    assert stop_path.parent == petri_dir\n    assert \"stop\"\
    \ in stop_path.read_text()\n\n\ndef test_is_stop_file_present_detects_file(petri_dir):\n    from petri.engine.processor\
    \ import (\n        clear_stop_file,\n        is_stop_file_present,\n        request_stop_file,\n\
    \    )\n\n    assert is_stop_file_present(petri_dir) is False\n    request_stop_file(petri_dir)\n\
    \    assert is_stop_file_present(petri_dir) is True\n    clear_stop_file(petri_dir)\n    assert is_stop_file_present(petri_dir)\
    \ is False\n\n\ndef test_clear_stop_file_is_idempotent(petri_dir):\n    \"\"\"Calling clear_stop_file\
    \ when no sentinel exists must not raise.\"\"\"\n    from petri.engine.processor import clear_stop_file,\
    \ is_stop_file_present\n\n    assert is_stop_file_present(petri_dir) is False\n    # First call on\
    \ an empty dir — must be a no-op, not a FileNotFoundError.\n    clear_stop_file(petri_dir)\n    #\
    \ Second call — still a no-op.\n    clear_stop_file(petri_dir)\n    assert is_stop_file_present(petri_dir)\
    \ is False\n\n\ndef test_forced_failure_triggers_stop_gap(monkeypatch, petri_dir):\n    \"\"\"Verify\
    \ that a failure in the grow loop triggers the stop-gap mechanism.\"\"\"\n    from petri.engine.processor\
    \ import (\n        clear_stop_file,\n        grow,\n        is_stop_file_present,\n    )\n\n    #\
    \ Mock the internal step function to simulate a forced failure\n    def mock_step(*args, **kwargs):\n\
    \        raise RuntimeError(\"Simulated grow loop failure\")\n\n    monkeypatch.setattr(\"petri.engine.processor._step\"\
    , mock_step)\n\n    # The grow loop should catch the exception and create the stop file\n    with\
    \ pytest.raises(RuntimeError):\n        grow(petri_dir)\n\n    # Verify stop-gap mechanism triggered\n\
    \    assert is_stop_file_present(petri_dir) is True\n    clear_stop_file(petri_dir)\n"
notes: Added unit test to verify the forced-failure stop-gap mechanism. Mocks the internal loop step to
  raise an exception, ensuring the grow loop's exception handler correctly triggers stop file creation.
  Follows existing test patterns and isolates external I/O.
test_command: uv run pytest tests/unit/test_processor_stop_file.py::test_forced_failure_triggers_stop_gap
  -v
