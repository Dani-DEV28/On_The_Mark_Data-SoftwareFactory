# llama-swap Configuration — Software Factory
# Hot-swap matrix for concurrent model serving on GB10

server:
  host: "0.0.0.0"
  port: 11434
  heartbeat: 30s

models:
  gemini-4:
    model: "google/gemma-3-27b-it-Q8_0.gguf"
    backend: "vllm"
    gpu_layers: 99
    context: 32768
    max_tokens: 8192
    temperature: 0.7

  nemotron:
    model: "nvidia/nemotron-3-super-120b"
    backend: "vllm"
    gpu_layers: 99
    context: 32768
    max_tokens: 8192
    temperature: 0.7

  qwen3.6:
    model: "qwen/qwen3-32b-Q8_0.gguf"
    backend: "vllm"
    gpu_layers: 99
    context: 32768
    max_tokens: 8192
    temperature: 0.7

concurrent:
  enabled: true
  max_concurrent: 3
  swap_strategy: lru

fallback:
  enabled: true
  model: "nemotron"
  timeout: 120s
